# Downloads the CC0 textures listed in tools/fetch-assets.mjs, converts them
# to WebP (tools/optimize-textures.py) and commits them, so the site never depends on a third-party host at runtime.
# Run it by hand from the Actions tab when the texture list changes.
name: Fetch assets

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: Texture resolution (1k or 2k)
        default: 1k
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download textures
        run: node tools/fetch-assets.mjs "${{ inputs.resolution }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert to WebP
        run: |
          pip install --quiet pillow
          python tools/optimize-textures.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Assets: CC0 textures from Poly Haven (${{ inputs.resolution }})"
          git push
