# Runs both test suites on every push and pull request, and publishes the
# browser client (web/) to GitHub Pages on every push to main.
# One-time setting in the repository: Settings > Pages > Source: GitHub Actions.
name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++ flight model tests
        run: sh core/cpp/tests/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript tests (incl. C++ cross-check)
        working-directory: web
        run: npm test

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
